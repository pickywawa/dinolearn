<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#7cc8f5" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DinoLearn" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>DinoLearn</title>
    <link rel="preload" as="image" href="/loading/splash.webp" />
    <!-- Appli iOS : l'image de démarrage est déjà derrière la page (MainViewController) ; la page reste
         transparente jusqu'à l'écran de chargement, pour un enchaînement sans coupure. -->
    <script>if (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios') document.documentElement.classList.add('native-ios');</script>
    <link rel="stylesheet" href="/src/loading.css" />
    <link rel="preload" as="fetch" href="/models/dino.glb" crossorigin />
    <style>
      html, body { margin: 0; height: 100%; background: #bfe6ff; overflow: hidden; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      .native-ios, .native-ios body, .native-ios #loading-screen { background-color: transparent; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; }
      html:fullscreen, html:-webkit-full-screen { width: 100%; height: 100%; }
      :root { --safe-left: var(--app-safe-left, env(safe-area-inset-left, 0px));
        --safe-right: var(--app-safe-right, env(safe-area-inset-right, 0px));
        --safe-top: var(--app-safe-top, env(safe-area-inset-top, 0px));
        --safe-bottom: var(--app-safe-bottom, env(safe-area-inset-bottom, 0px)); }
      /* Le jeu se joue en paysage. Tenu en portrait : là où le navigateur sait passer en plein écran
         paysage (Android…), un toucher le fait ; sinon (iPhone), on demande de tourner l'appareil. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: linear-gradient(#7cc8f5, #c9ecff);
        color: #2d3354; font: 700 7vw/1.2 'Baloo 2', 'Arial Rounded MT Bold', Arial, sans-serif; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; gap: 6vw; }
      #rotate .phone { width: 22vw; height: 38vw; border: 2.4vw solid #2d3354; border-radius: 4vw; background: #fff8e7;
        animation: turn 2.2s ease-in-out infinite; }
      @keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
      #rotate small { font-size: 4.2vw; font-weight: 600; max-width: 80vw; opacity: .8; }
      #rotate .tap { display: none; }
      .can-lock #rotate .turn { display: none; }
      .can-lock #rotate .tap { display: block; }
      .can-lock #rotate .phone { animation: none; transform: rotate(-90deg); }
      .installed #rotate small { display: none; }
      @media (orientation: portrait) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="loading-screen" aria-label="Chargement du jeu">
      <div class="loading-progress" role="progressbar" aria-label="Chargement" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loading-fill"></div>
        <div class="loading-status"><span class="loading-what">Chargement…</span><span class="loading-percent">0 %</span></div>
      </div>
    </div>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <div class="turn">Tourne ta tablette !<br /><small>Astuce : « Ajouter à l'écran d'accueil » ouvre le jeu en plein écran.</small></div>
      <div class="tap">Touche l'écran pour jouer !</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
