name: Déployer le jeu web

on:
  push:
    branches: [main, claude/dinosaur-educational-game-fe9wof]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Packs de reconnaissance vocale (jeux à voix haute), servis à côté du jeu : téléchargés une fois, puis en cache.
      - uses: actions/cache@v4
        with:
          path: web/public/voice
          key: voice-packs-v1-${{ hashFiles('web/scripts/voice-packs.mjs') }}
      - run: npm run voice-packs
      # Les tests vérifient que les images existent (et le vocabulaire des packs).
      - run: npm run icons
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
