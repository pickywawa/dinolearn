name: Publier une release

# Crée le tag v<version de web/package.json> et la release GitHub correspondante,
# avec le jeu compilé en pièce jointe. Se lance quand les notes de version changent,
# ou à la main (onglet Actions → « Run workflow »).
on:
  push:
    branches: [main, claude/dinosaur-educational-game-fe9wof]
    paths: ['web/RELEASE_NOTES.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # Les tests vérifient que les images existent.
      - run: npm run icons
      - run: npm test
      - run: npm run build
      - name: Archive du jeu compilé
        run: cd dist && zip -r ../dinolearn-web-${{ steps.version.outputs.tag }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DinoLearn ${{ steps.version.outputs.tag }}
          body_path: web/RELEASE_NOTES.md
          files: web/dinolearn-web-${{ steps.version.outputs.tag }}.zip
